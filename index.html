<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7b1e1e">
<title>Đại gia đình Cụ Hiệp</title>
<style>body{margin:0;background:#f6f1e9;font:20px system-ui,sans-serif;color:#6e635a}p{text-align:center;margin-top:40vh}</style>
</head>
<body>
<p id="m">Đang mở album gia đình…</p>
<script>
// Trang này chỉ là "cửa vào": giao diện + ảnh lấy từ album trên Google (luôn là bản mới nhất).
// Lần sau mở lại thì hiện ngay bản đã nhớ trên máy, đồng thời lấy bản mới cho lần sau.
var API = 'https://script.google.com/macros/s/AKfycbzArIl-VoTpRsUCC1fICpm8u7wV77RHrI7A3MJ2GUQLrH9vIjFKMRLzLyCnpYeIy31C/exec';
var KEY = 'album_page_v1';
function put(html) { document.open(); document.write(html); document.close(); }
var cached = null;
try { cached = localStorage.getItem(KEY); } catch (e) {}
var req = fetch(API + '?format=page', { credentials: 'omit' }).then(function (r) { return r.json(); }).then(function (j) {
  if (j && j.html) { try { localStorage.setItem(KEY, j.html); } catch (e) {} }
  return j && j.html;
});
if (cached) put(cached);
else req.then(function (h) { if (h) put(h); else throw 0; }).catch(function () {
  document.getElementById('m').innerHTML = 'Chưa mở được album.<br><br><a href="" style="color:#7b1e1e">Bấm để thử lại</a>';
});
</script>
</body>
</html>
